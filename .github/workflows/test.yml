name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .[dev,langchain]
      - name: Test
        run: python -m pytest tests/ -v

  # 发布工程（KIMICODE-SDKFIX5）：打包冒烟 / 类型检查 / langchain 兼容双档 / 依赖审计
  packaging-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build + install wheel + smoke
        run: |
          pip install build twine
          python -m build
          pip install dist/*.whl
          python -c "import entropy_sdk; print(entropy_sdk.__version__)"
      - name: Test installed wheel
        run: |
          pip install pytest
          python -m pytest tests/ -q
      - name: twine check
        run: twine check dist/*
      - name: Wheel content assertions (FIX6-2)
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(whl).namelist())
          assert "entropy_sdk/py.typed" in names, "py.typed missing from wheel"
          assert any(n.endswith("LICENSE") or n == "LICENSE" for n in names), "LICENSE missing from wheel"
          print("wheel content OK: py.typed + LICENSE present")
          PY

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: mypy src/
        run: |
          pip install mypy
          mypy src/ --ignore-missing-imports

  langchain-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        langchain-core: ["langchain-core==0.2.43", "langchain-core<1.0"]  # 最低实测支持版 + 声明域内最新
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (pinned or latest langchain-core)
        run: |
          pip install -e .[dev]
          pip install "${{ matrix.langchain-core }}"
          python -c "import langchain_core; print('langchain-core', langchain_core.__version__)"
      - name: Test
        run: python -m pytest tests/ -q

  pip-audit:
    runs-on: ubuntu-latest
    continue-on-error: true   # 依赖审计只报告不挡路（allow-fail）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit（三态证据：PASS / VULN / UNMEASURED）
        run: |
          pip install pip-audit
          pip install -e .
          set +e
          OUT=$(pip-audit 2>&1); RC=$?
          set -e
          echo "$OUT"
          if [ $RC -eq 0 ]; then
            echo "PIPAUDIT_STATE=PASS" | tee -a "$GITHUB_STEP_SUMMARY"
          elif echo "$OUT" | grep -qiE "unhealthy|503|error connecting|temporarily unavailable|timed out"; then
            echo "PIPAUDIT_STATE=UNMEASURED" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::warning::pip-audit UNMEASURED（查询未完成，不得计入通过）"
          else
            echo "PIPAUDIT_STATE=VULN" | tee -a "$GITHUB_STEP_SUMMARY"
            exit $RC
          fi
