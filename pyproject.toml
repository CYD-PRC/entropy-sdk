[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entropy-sdk"
version = "0.1.8"
description = "Gear-based safety control layer for autonomous agents (EntropyRuntime core, embeddable SDK)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Wang Miaosheng", email = "wmsmiaosheng@outlook.com" },
]
keywords = ["ai-safety", "agent", "governance", "runtime-verification", "gear"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# 核心零依赖：纯 stdlib。框架适配器按需安装 extras。
dependencies = []

[project.optional-dependencies]
langchain = ["langchain-core>=0.2.43,<1.0"]  # 地板钉实测值：0.2.0 实测不兼容（pydantic v1 shim 校验炸），0.2.43 实测通过
pydanticai = []  # FIX-8：该适配器为纯 stdlib 装饰器，实际零框架依赖（名实对齐）
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/CYD-PRC/entropy-sdk"
Paper = "https://arxiv.org/abs/2607.00334"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
